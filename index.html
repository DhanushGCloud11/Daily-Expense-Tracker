<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>Expense Tracker</h1>
                <p>Manage your daily finances easily.</p>
            </div>
            <span class="date" id="currentDate"></span>
        </header>

        <!-- Dashboard Summary -->
        <section class="summary">
            <div class="summary-card">
                <h3>Total Balance</h3>
                <h2 id="totalBalance">₹0.00</h2>
            </div>

            <div class="summary-card income-card">
                <h3>Total Income</h3>
                <h2 id="totalIncome">₹0.00</h2>
            </div>

            <div class="summary-card expense-card">
                <h3>Total Expenses</h3>
                <h2 id="totalExpenses">₹0.00</h2>
            </div>
        </section>

        <main class="content">
            <!-- Add Transaction Form -->
            <section class="form-section">
                <h2 id="formTitle">Add Transaction</h2>

                <form id="expenseForm">
                    <label for="description">Description</label>
                    <input
                        type="text"
                        id="description"
                        placeholder="Enter description"
                        required
                    >

                    <label for="amount">Amount (₹)</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="0.01"
                        step="0.01"
                        required
                    >

                    <label for="type">Transaction Type</label>
                    <select id="type" required>
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>

                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Salary">Salary</option>
                        <option value="Other">Other</option>
                    </select>

                    <label for="date">Date</label>
                    <input type="date" id="date" required>

                    <button type="submit" id="submitBtn">
                        Add Transaction
                    </button>

                    <button type="button" id="cancelBtn" class="cancel-btn" hidden>
                        Cancel Edit
                    </button>
                </form>
            </section>

            <!-- Transaction History -->
            <section class="history-section">
                <h2>Transaction History</h2>

                <div class="filters">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search transactions..."
                    >

                    <select id="filterCategory">
                        <option value="All">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Salary">Salary</option>
                        <option value="Other">Other</option>
                    </select>

                    <select id="filterType">
                        <option value="All">All Types</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>

                <div id="transactionList" class="transaction-list">
                    <p class="empty-message">No transactions yet.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
